[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-discord"
version = "0.2.0"
description = "High-performance Python bindings for Rift Discord v10 engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "isaim0011" }]
keywords = ["discord", "bot", "gateway", "api", "rust", "rift"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/isaim0011/rift"
Repository = "https://github.com/isaim0011/rift"

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
rift = ["py.typed", "*.pyi"]
