[package]
name = "rift-py"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "_rift"
crate-type = ["cdylib", "rlib"]

[dependencies]
rift-core = { path = "../../crates/rift-core" }
rift-http = { path = "../../crates/rift-http" }
rift-gateway = { path = "../../crates/rift-gateway" }
rift-model = { path = "../../crates/rift-model" }
rift-cache = { path = "../../crates/rift-cache" }
rift-rest = { path = "../../crates/rift-rest" }
rift = { path = "../../crates/rift" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

pyo3 = { version = "0.24", optional = true }

[features]
default = ["extension-module"]
extension-module = ["pyo3-binding", "pyo3/extension-module"]
pyo3-binding = ["dep:pyo3"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "time", "sync"] }
serde_json = "1"
