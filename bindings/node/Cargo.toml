[package]
name = "rift-node"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rift-core = { package = "rift-discord-core", path = "../../crates/rift-core" }
rift-http = { path = "../../crates/rift-http" }
rift-gateway = { path = "../../crates/rift-gateway" }
rift-model = { path = "../../crates/rift-model" }
rift-cache = { path = "../../crates/rift-cache" }
rift-rest = { path = "../../crates/rift-rest" }
rift = { package = "rift-discord", path = "../../crates/rift" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

napi = { version = "2.16", default-features = false, features = ["async", "serde-json"], optional = true }
napi-derive = { version = "2.16", optional = true }

[build-dependencies]
napi-build = { version = "2.1", optional = true }

[features]
default = ["napi-binding"]
napi-binding = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "time", "sync"] }
serde_json = "1"
