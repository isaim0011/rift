[package]
name = "rift-cache"
description = "Opt-in, high-performance, obfuscation-safe in-memory state cache for Discord bots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rift-cache"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
rift-core = { package = "rift-discord-core", path = "../rift-core", version = "0.1.0" }
rift-model = { path = "../rift-model", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
