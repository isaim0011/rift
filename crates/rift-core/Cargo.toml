[package]
name = "rift-discord-core"
description = "Zero-dependency Discord primitives: snowflakes, intents, sharding math."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rift-discord-core"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "rift_core"

[dependencies]
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]
